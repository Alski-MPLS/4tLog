services:
  app:
    build: .
    image: 4tlog:latest
    container_name: 4tlog
    restart: unless-stopped
    ports:
      - "8100:8100"
    env_file:
      - .env
      # If TLS terminates at a reverse proxy in front of this container
      # (the expected topology), set COOKIE_SECURE=true and
      # TRUSTED_PROXY_COUNT accordingly in .env — COOKIE_SECURE=auto only
      # detects local certs/cert.pem, which won't exist here.
    volumes:
      - ./users.json:/app/users.json:rw
      - ./groups.json:/app/groups.json:rw
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8100/login', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
