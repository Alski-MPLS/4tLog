---
- name: Query FortiAnalyzer logs through JSON-RPC
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    faz_host: 192.168.64.4
    faz_port: 443
    faz_validate_certs: false
    faz_username: ""
    faz_api_key: ""
    faz_adom: root
    faz_device: All_FortiGate
    faz_log_type: traffic
    faz_max_logs: 500
    faz_request_timeout_seconds: 120
    faz_search_timeout_seconds: 30
    faz_poll_delay_seconds: 1
    faz_rpc_resource: "/logview/adom/{{ faz_adom }}/logsearch"
    faz_preflight_resource: "/logview/adom/{{ faz_adom }}/logfields"
    faz_preflight_devtype: FortiGate
    faz_output_dir: "{{ playbook_dir }}/output"
    faz_output_file: "{{ faz_output_dir }}/faz_log_search.json"
    faz_output_format: json

    # Filters are stored as inputs first so we can map them to the exact FAZ
    # request payload once the log-search endpoint is finalized.
    faz_source_ips: []
    faz_destination_ips: []
    faz_ports: []
    faz_time_window: ""
    faz_start_time: ""
    faz_end_time: ""

  tasks:
    - name: Require an API key
      ansible.builtin.assert:
        that:
          - faz_api_key | length > 0
        fail_msg: "Pass faz_api_key with --extra-vars or a vaulted vars file."

    - name: Normalize the time range
      ansible.builtin.set_fact:
        faz_time_range:
          last-n-hours: 24

    - name: Use an explicit start/end time range when provided
      ansible.builtin.set_fact:
        faz_time_range:
          start: "{{ faz_start_time }}"
          end: "{{ faz_end_time }}"
      when:
        - faz_start_time | length > 0
        - faz_end_time | length > 0

    - name: Use a last-n-minutes time range when requested
      ansible.builtin.set_fact:
        faz_time_range:
          last-n-minutes: "{{ faz_time_window | regex_replace('m$', '') | int }}"
      when: faz_time_window is match('^\d+m$')

    - name: Use a last-n-hours time range when requested
      ansible.builtin.set_fact:
        faz_time_range:
          last-n-hours: "{{ faz_time_window | regex_replace('h$', '') | int }}"
      when: faz_time_window is match('^\d+h$')

    - name: Use a day-based time range when requested
      ansible.builtin.set_fact:
        faz_time_range:
          last-n-hours: "{{ (faz_time_window | regex_replace('d$', '') | int) * 24 }}"
      when: faz_time_window is match('^\d+d$')

    - name: Normalize the device payload
      ansible.builtin.set_fact:
        faz_device_payload: >-
          {{
            faz_device
            if (faz_device is sequence and faz_device is not string)
            else [{'devid': faz_device}]
          }}

    - name: Build the log filter expression
      ansible.builtin.set_fact:
        faz_filter_clauses: >-
          {% set clauses = [] %}
          {% for ip in faz_source_ips %}
          {% if ip | upper not in ['ANY', 'ALL'] %}
          {% set _ = clauses.append('srcip==' ~ ip) %}
          {% endif %}
          {% endfor %}
          {% for ip in faz_destination_ips %}
          {% if ip | upper not in ['ANY', 'ALL'] %}
          {% set _ = clauses.append('dstip==' ~ ip) %}
          {% endif %}
          {% endfor %}
          {% for port in faz_ports %}
          {% if port | upper not in ['ANY', 'ALL'] %}
          {% if port is match('^\\d+$') %}
          {% set _ = clauses.append('dstport==' ~ port) %}
          {% elif port is match('^(tcp|udp):\\d+$') %}
          {% set _ = clauses.append('dstport==' ~ (port.split(':')[-1])) %}
          {% else %}
          {% set _ = clauses.append('service=="' ~ port ~ '"') %}
          {% endif %}
          {% endif %}
          {% endfor %}
          {{ clauses | join(' and ') }}

    - name: Trim stray whitespace left by the filter template
      ansible.builtin.set_fact:
        faz_filter_clauses: "{{ faz_filter_clauses | trim }}"

    - name: Build the step 1 JSON-RPC request body
      ansible.builtin.debug:
        msg: |
          FAZ target: https://{{ faz_host }}:{{ faz_port }}/jsonrpc
          Resource: {{ faz_rpc_resource }}
          Preflight resource: {{ faz_preflight_resource }}
          Time range: {{ faz_time_range | to_nice_yaml(indent=2) | trim }}
          Device payload: {{ faz_device_payload | to_nice_yaml(indent=2) | trim }}
          Filter expression: {{ faz_filter_clauses if faz_filter_clauses | length > 0 else '(none)' }}
          Query inputs:
          {{ {
            'device': faz_device,
            'logtype': faz_log_type,
            'source_ips': faz_source_ips,
            'destination_ips': faz_destination_ips,
            'ports': faz_ports,
            'time_window': faz_time_window,
            'start_time': faz_start_time,
            'end_time': faz_end_time,
            'max_logs': faz_max_logs,
            'output_format': faz_output_format
          } | to_nice_yaml(indent=2) }}

    - name: Run a quick logview preflight
      ansible.builtin.uri:
        url: "https://{{ faz_host }}:{{ faz_port }}/jsonrpc"
        method: POST
        headers:
          Authorization: "Bearer {{ faz_api_key }}"
          Content-Type: application/json
        body_format: json
        body:
          jsonrpc: "2.0"
          method: get
          params:
            - url: "{{ faz_preflight_resource }}"
              apiver: 3
              devtype: "{{ faz_preflight_devtype }}"
              logtype: "{{ faz_log_type }}"
          session: null
          id: 0
        return_content: true
        validate_certs: "{{ faz_validate_certs }}"
        timeout: "{{ faz_request_timeout_seconds }}"
      register: faz_preflight_check
      changed_when: false
      failed_when: false

    - name: Stop early if the preflight cannot read logview
      ansible.builtin.fail:
        msg: >-
          Logview preflight failed before the full search ran.
          This usually means the API key is accepted but the account still
          lacks logview access for this ADOM or host.
          Response={{ faz_preflight_check.json | to_json }}
      when: >-
        (faz_preflight_check.json.result is defined)
        and (faz_preflight_check.json.result is sequence)
        and (faz_preflight_check.json.result | length > 0)
        and (faz_preflight_check.json.result[0].status is defined)
        and ((faz_preflight_check.json.result[0].status.code | default(0)) != 0)

    - name: Show the preflight result
      ansible.builtin.debug:
        var: faz_preflight_check.json

    - name: Submit the log search
      block:
        - name: Submit the documented log-search request
          ansible.builtin.uri:
            url: "https://{{ faz_host }}:{{ faz_port }}/jsonrpc"
            method: POST
            headers:
              Authorization: "Bearer {{ faz_api_key }}"
              Content-Type: application/json
            body_format: json
            body:
              jsonrpc: "2.0"
              method: add
              params:
                - url: "{{ faz_rpc_resource }}"
                  apiver: 3
                  device: "{{ faz_device_payload }}"
                  filter: "{{ faz_filter_clauses }}"
                  limit: "{{ faz_max_logs }}"
                  logtype: "{{ faz_log_type }}"
                  offset: 0
                  case-sensitive: false
                  time-order: desc
                  time-range: "{{ faz_time_range }}"
              session: null
              id: 1
            return_content: true
            validate_certs: "{{ faz_validate_certs }}"
            timeout: "{{ faz_request_timeout_seconds }}"
          register: faz_search_submit
          failed_when: >-
            faz_search_submit.json.error is defined
            or (faz_search_submit.json.result is not defined)
            or (faz_search_submit.json.result.tid is not defined)

        - name: Record the task ID
          ansible.builtin.set_fact:
            faz_search_tid: >-
              {{
                faz_search_submit.json.result.tid
                if (faz_search_submit.json.result is mapping and faz_search_submit.json.result.tid is defined)
                else ''
              }}
          when:
            - faz_search_submit is defined

        - name: Fail if no task ID was returned
          ansible.builtin.fail:
            msg: >-
              Submit call returned no task ID.
              Submit response={{ faz_search_submit.json | to_json }}
          when: (faz_search_tid | string | length) == 0

        - name: Fetch the task result
          ansible.builtin.uri:
            url: "https://{{ faz_host }}:{{ faz_port }}/jsonrpc"
            method: POST
            headers:
              Authorization: "Bearer {{ faz_api_key }}"
              Content-Type: application/json
            body_format: json
            body:
              jsonrpc: "2.0"
              method: get
              params:
                - url: "{{ faz_rpc_resource }}/{{ faz_search_tid }}"
                  apiver: 3
                  limit: "{{ faz_max_logs }}"
                  offset: 0
              session: null
              id: 2
            return_content: true
            validate_certs: "{{ faz_validate_certs }}"
            timeout: "{{ faz_request_timeout_seconds }}"
          register: faz_search_result
          until: >-
            (faz_search_result.json.result.percentage | default(0)) | int == 100
          retries: "{{ (faz_search_timeout_seconds | int) // (faz_poll_delay_seconds | int) + 1 }}"
          delay: "{{ faz_poll_delay_seconds }}"
          failed_when: >-
            faz_search_result.json.error is defined
            or (faz_search_result.json.result is not defined)
            or ((faz_search_result.json.result.status.code | default(0)) not in [0])

        - name: Show the final FAZ result payload
          ansible.builtin.debug:
            var: faz_search_result.json

      rescue:
        - name: Dump the FAZ response that caused the failure
          ansible.builtin.debug:
            var: faz_search_submit if faz_search_submit is defined else faz_search_result

        - name: Fail with a short API hint
          ansible.builtin.fail:
            msg: >-
              FortiAnalyzer did not complete the log search successfully.
              The API transport is working, but the resource path, log type,
              or search payload still needs adjustment for this account or
              firmware.

    - name: Ensure the output directory exists
      ansible.builtin.file:
        path: "{{ faz_output_dir }}"
        state: directory
        mode: "0755"

    - name: Write the response as JSON
      ansible.builtin.copy:
        dest: "{{ faz_output_file }}"
        content: "{{ faz_search_result.json | to_nice_json }}\n"
        mode: "0644"
      when: faz_output_format == 'json'

    - name: Tell the operator where the export landed
      ansible.builtin.debug:
        msg: "Saved FAZ output to {{ faz_output_file }}"