[project]
name = "4tlog"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0,<4",
    "python-dotenv>=1.0",
    "bcrypt>=4.1",
]

[project.optional-dependencies]
prod = ["gunicorn>=22"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

